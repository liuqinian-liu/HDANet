DATA:
  data_root: '/home/abc123/tiger/data/MSD-Seg/'
  train_list: './data_list/defect_msd/train/fold2_defect.txt'
  val_list: './data_list/defect_msd/val/fold2_defect.txt'
  classes: 2
  data_set: 'msd'


TRAIN:
  layers: 50
  sync_bn: False
  train_h: 200
  train_w: 200
  val_size: 200
  scale_min: 0.9  # minimum random scale
  scale_max: 1.1 # maximum random scale
  rotate_min: -10  # minimum random rotate
  rotate_max: 10  # maximum random rotate
  zoom_factor: 8  # zoom factor for final prediction during training, be in [1, 2, 4, 8]
  ignore_label: 255
  padding_label: 255
  aux_weight: 1.0
  train_gpu: [0]
  workers: 4  # data loader workers
  batch_size: 2 # batch size for training
  batch_size_val: 1
  base_lr: 0.0025
  epochs: 200
  start_epoch: 0
  power: 0.9 # 0 means no decay
  momentum: 0.9
  weight_decay: 0.0001
  manual_seed: 200
  print_freq: 5
  save_freq: 20
  save_path: Weight/MSD-seg/Fold2
  weight: Weight/MSD-seg/Fold2/5shot/train_epoch_109_0.3672619279864844.pth
  resume:
  evaluate: True
  split: 2
  shot: 5
  vgg: False
  ppm_scales: [60, 30, 15, 8]
  fix_random_seed_val: True
  warmup: False
  use_coco: False
  use_split_coco: False
  resized_val: True
  ori_resize: True  # use original label for evaluation
  bgpro_num: 2


## deprecated multi-processing training
Distributed:
  dist_url: tcp://127.0.0.1:6789
  dist_backend: 'nccl'
  multiprocessing_distributed: False
  world_size: 1
  rank: 0
  use_apex: False
  opt_level: 'O0'
  keep_batchnorm_fp32:
  loss_scale:

