DATA:
  data_root: '/home/abc123/tiger/data/NEUseg-24'
  train_list: './data_list/defect_neuseg_24/train/fold3.txt'
  val_list: './data_list/defect_neuseg_24/val/fold3.txt'
  classes: 2
  data_set: 'neuseg'

TRAIN:
  layers: 50
  sync_bn: False
  train_h: 200
  train_w: 200
  val_size: 200
  scale_min: 0.9    # minimum random scale
  scale_max: 1.1    # maximum random scale
  rotate_min: -10   # minimum random rotate
  rotate_max: 10    # maximum random rotate
  zoom_factor: 8
  ignore_label: 255
  padding_label: 255
  aux_weight: 1.0
  train_gpu: [0]
  workers: 8        # data loader workers 2->4
  batch_size: 4     # batch size for training
  batch_size_val: 1
  base_lr: 0.0025
  epochs: 200
  start_epoch: 0
  power: 0.9        # 0 means no decay
  momentum: 0.9
  weight_decay: 0.0001
  manual_seed: 2025
  print_freq: 5
  save_freq: 5
#  save_path: exp/NEU-Seg/fold0_resnet50/model_5shot   # model_hdanet saved path
#  shot: 5
  save_path: Weight/NEUseg-24/fold3/1-shot    # model_hdanet saved path
  shot: 1
  weight:   #/media/Data/PHD/CPANet-main/NEUseg-24/fold1.pth # load weight for fine-tuning or testing
  resume:                                         # path to latest checkpoint (default: none)
  evaluate: True
  split: 3
  vgg: False # use vgg as backbone or not
#  ppm_scales: [66, 33, 16, 8]
  ppm_scales: [60, 30, 15, 8]
  fix_random_seed_val: True
  warmup: False
  resized_val: True
  ori_resize: True  # use original label for evaluation
